name: Publish MCP server.json

on:
  push:
    branches: ["main"]
    paths: ["server.json"]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  PUBLISHER_VERSION: v1.8.1
  REGISTRY_URL: https://registry.modelcontextprotocol.io
  AUTH_DOMAIN: onkernel.com

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check whether this version is already published
        id: version
        run: |
          name="$(jq -r .name server.json)"
          want="$(jq -r .version server.json)"
          live="$(curl -fsS --get --data-urlencode "search=$name" "$REGISTRY_URL/v0/servers" \
            | jq -r --arg name "$name" '.servers[] | select(.server.name == $name) | .server.version')"
          if [ "$live" = "$want" ]; then
            echo "::notice::$name@$want is already published; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "publishing $name: ${live:-none} -> $want"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install mcp-publisher
        if: steps.version.outputs.skip == 'false'
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/$PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz" \
            | tar -xz mcp-publisher
          ./mcp-publisher --version

      - name: Log in to the registry
        if: steps.version.outputs.skip == 'false'
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: |
          # The secret holds the base64 body of a PKCS#8 Ed25519 private key. For
          # Ed25519 the 48-byte DER ends with the 32-byte seed, which is what the
          # publisher wants as 64 hex characters.
          seed="$(printf '%s' "$MCP_PRIVATE_KEY" | tr -d ' \r\n' | base64 -d | tail -c 32 | od -An -tx1 | tr -d ' \n')"
          echo "::add-mask::$seed"
          if [ "${#seed}" -ne 64 ]; then
            echo "::error::MCP_PRIVATE_KEY did not yield a 32-byte Ed25519 seed. It must hold the base64 body of a PKCS#8 Ed25519 private key."
            exit 1
          fi

          # Fail here rather than on an opaque 401: the registry trusts whatever
          # public key is published at the domain apex, so the secret has to match it.
          pub="$(printf '302e020100300506032b657004220420%s' "$seed" \
            | python3 -c 'import sys, binascii; sys.stdout.buffer.write(binascii.unhexlify(sys.stdin.read().strip()))' \
            | openssl pkey -inform DER -pubout -outform DER | tail -c 32 | base64)"
          dns="$(curl -fsS -H 'accept: application/dns-json' "https://dns.google/resolve?name=$AUTH_DOMAIN&type=TXT" \
            | jq -r '.Answer[]?.data' | tr -d '"' \
            | sed -n 's/.*v=MCPv1.*p=\([A-Za-z0-9+/=]*\).*/\1/p' | head -1)"
          if [ -z "$dns" ]; then
            echo "::error::No v=MCPv1 TXT record at the $AUTH_DOMAIN apex. MCP DNS auth reads the apex, not a _mcp-registry selector."
            exit 1
          fi
          if [ "$pub" != "$dns" ]; then
            echo "::error::MCP_PRIVATE_KEY does not match the key published at $AUTH_DOMAIN ($dns)."
            exit 1
          fi

          ./mcp-publisher login dns -domain "$AUTH_DOMAIN" -private-key "$seed"

      - name: Publish to MCP Registry
        if: steps.version.outputs.skip == 'false'
        run: ./mcp-publisher publish
