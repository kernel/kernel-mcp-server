name: CI

on:
  pull_request:
    branches: [main]
  merge_group:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin Bun: the managed-auth App bundle check is byte-exact and Bun's
      # minifier output can change between releases. Regenerate the bundle
      # with this exact version when bumping it.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"

      - run: bun install --frozen-lockfile

      - name: Check managed-auth App bundle
        run: bun run check:managed-auth-app

      - name: Type check
        run: bunx tsc --noEmit --incremental false

      - name: Test
        run: bun test

      - name: Check out Kernel docs
        # Track docs main deliberately so either repository can detect cross-repo drift.
        uses: actions/checkout@v4
        with:
          repository: kernel/docs
          path: kernel-docs
          sparse-checkout: |
            reference/mcp-server/tools/manage-browser-pools.mdx
            reference/mcp-server/tools/manage-profiles.mdx
            reference/mcp-server/tools/manage-proxies.mdx
          sparse-checkout-cone-mode: false

      - name: Check MCP documentation top-level parameter-name parity
        run: bun scripts/check-doc-top-level-parameter-name-parity.ts "$GITHUB_WORKSPACE/kernel-docs"
