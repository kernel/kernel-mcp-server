schema_version = "1.4"
source = "kernel-mcp-benchmarks"
artifacts = ["/logs/kernel-mcp"]
multi_step_reward_strategy = "final"

[task]
name = "kernel-mcp/local-connection-smoke"
description = "Verify an agent can call a locally running Kernel MCP server"
keywords = ["kernel", "mcp", "harbor", "smoke"]

[metadata]
benchmark = "kernel-mcp-local-connection"
kernel_mcp_server_sha = "${KERNEL_MCP_SOURCE_SHA}"

[environment]
docker_image = "${KERNEL_MCP_BENCHMARK_IMAGE}"
network_mode = "public"
workdir = "/app"
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 4096
storage_mb = 8192

[environment.env]
KERNEL_API_KEY = "${KERNEL_MCP_BENCHMARK_API_KEY}"
KERNEL_MCP_BENCHMARK_IMAGE = "${KERNEL_MCP_BENCHMARK_IMAGE}"
KERNEL_MCP_SOURCE_SHA = "${KERNEL_MCP_SOURCE_SHA}"
KERNEL_MCP_EXPECTED_PROJECT_ID = "${KERNEL_MCP_BENCHMARK_PROJECT_ID}"
KERNEL_PROJECT = "${KERNEL_MCP_BENCHMARK_PROJECT_ID}"
API_BASE_URL = "${KERNEL_API_BASE_URL:-https://api.onkernel.com}"
REDIS_URL = "redis://127.0.0.1:6379"
CLERK_SECRET_KEY = "sk_test_kernel_mcp_benchmark_local_only"
NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY = "pk_test_YmVuY2htYXJrLmNsZXJrLmFjY291bnRzLmRldiQ"
MANAGED_AUTH_APP_ORIGIN = "http://127.0.0.1:3002"
NEXT_TELEMETRY_DISABLED = "1"

[[steps]]
name = "run"

[steps.agent]
timeout_sec = 300.0

[steps.verifier]
timeout_sec = 60.0

[steps.healthcheck]
command = "test -s /logs/kernel-mcp/ready && curl -sS -o /dev/null http://127.0.0.1:3002/mcp"
interval_sec = 2.0
timeout_sec = 5.0
start_period_sec = 1.0
start_interval_sec = 1.0
retries = 10
